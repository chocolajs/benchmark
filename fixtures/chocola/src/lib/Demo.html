<script>
    let self = new HTMLElement;
    let btn = new HTMLButtonElement;
    let log = new HTMLElement;

    function $runtime() {
        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        var steps = ['resolving bindings …', 'baking component…', 'done'];

        setLabel();

        btn.addEventListener('click', () => { actDemo(reduced, steps) });
    }

    function setLabel() {
        btn.setAttribute('data-label', self.classList.contains('is-compiled') ? 'reset' : 'compile');
    }

    function actDemo(reduced, steps) {
        if (self.classList.contains('is-compiled')) {
            self.classList.remove('is-compiled');
            log.textContent = '';
            setLabel();
            return;
        }

        if (reduced) {
            self.classList.add('is-compiled');
            log.textContent = steps[steps.length - 1];
            setLabel();
            return;
        }

        var i = 0;
        log.textContent = steps[0];
        var interval = setInterval(function () {
            i++;
            if (i < steps.length) {
                log.textContent = steps[i];
            }
            if (i >= steps.length - 1) {
                self.classList.add('is-compiled');
                setLabel();
                clearInterval(interval);
            }
        }, 500);
    }
</script>
