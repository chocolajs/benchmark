<script>
    let self = new HTMLElement;
    let btn = new HTMLButtonElement;
    let installBox = new HTMLDivElement;
    let promptBefore = new HTMLDivElement;
    let ogPrompt = new HTMLSpanElement;
    let successMessage = new HTMLSpanElement;

    let installPrompt = "npm i chocola@next";

    async function $runtime() {
        btn.addEventListener("click", async () => { await copyPrompt() });
    }

    async function copyPrompt() {
        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        if (btn.disabled) return;

        successMessage.style.width = ogPrompt.getBoundingClientRect().width + "px";
        installBox.style.height = installBox.getBoundingClientRect().height + "px";

        navigator.clipboard.writeText(installPrompt);
        promptBefore.style.display = "block";
        btn.disabled = true;

        try {
            await delay(50);
            promptBefore.style.width = "100%";

            await delay(250);
            ogPrompt.style.opacity = "0";

            await delay(500);
            ogPrompt.style.display = "none";
            successMessage.style.display = "block";
            promptBefore.style.opacity = "0";

            await delay(50);
            successMessage.style.opacity = "1";

            await delay(1500);
            successMessage.style.opacity = "0";

            await delay(500);
            successMessage.style.display = "none";
            ogPrompt.style.display = "block";
            promptBefore.style.display = "none";
            promptBefore.style.width = "0%";
            promptBefore.style.opacity = "1";

            successMessage.style.width = "auto";
            installBox.style.height = "auto";
            btn.disabled = false;

            await delay(50);
            ogPrompt.style.opacity = "1";
        } catch (error) {
            console.error("Error en la animación de copiado:", error);
            btn.disabled = false;
        }
    }
</script>

<template>
    <section class="cta-block" id="start">
        <div class="wrap">
            <img src="../../static/icons/favicon.svg" alt="Chocola Logo">

            <div class="eyebrow" style="justify-content:center;">Get started</div>

            <h2>Install once. Compile forever.</h2>

            <p>No boilerplate. No plugins to reconcile. Point Chocola at a folder.</p>

            <div bind:self="installBox" class="install-box">
                <div bind:self="promptBefore" class="before"></div>

                <span bind:self="ogPrompt" class="og-prompt"><span class="pink">$</span> <span class="cmd">{installPrompt}</span></span>

                <span bind:self="successMessage" class="sccs-msg"><span class="brace-gold">&#123;</span> Prompt copied!
                    <span class="brace-gold">&#125;</span></span>

                <button bind:self="btn" class="copy-btn">Copy</button>
            </div>

            <div class="cta-switch">
                <span>Looking for stable? Use</span>
                <code>npm i chocola</code>
            </div>
        </div>
    </section>
</template>
