<script>
    let self;
    let closeBtn;

    function $runtime() {
        const dismissed = sessionStorage.getItem('chocola-banner-dismissed');
        if (dismissed === '1') {
            self.style.display = 'none';
            return;
        }

        closeBtn.addEventListener('click', () => {
            self.style.display = 'none';
            sessionStorage.setItem('chocola-banner-dismissed', '1');
        });
    }
</script>

<template>
    <div class="version-banner" role="status" aria-label="Preview version notice">
